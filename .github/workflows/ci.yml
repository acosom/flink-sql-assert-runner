name: CI

on:
  push:
    branches: [main, flink-1.20]
  pull_request:
    branches: [main, flink-1.20]

jobs:
  # Tests the assert runner's own internal logic (parsers, templating,
  # config loader, report writer, plus the Kafka + Flink IT tiers).
  runner-self-tests:
    name: Runner self-tests (mvn verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: mvn verify
        run: mvn -B verify

  # Runs the assert runner end-to-end via docker-compose against a real
  # Kafka + Flink session cluster + the bundled scenarios. Mirrors what
  # scripts/run-ci.sh does locally.
  end-to-end:
    name: End-to-end (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [unit, integration]
    steps:
      - name: Checkout assert runner
        uses: actions/checkout@v4
        with:
          path: flink-sql-assert-runner

      - name: Checkout flink-sql-runner (matching Flink line)
        if: matrix.profile == 'integration'
        uses: actions/checkout@v4
        with:
          repository: acosom/flink-sql-runner
          ref: ${{ github.ref_name == 'flink-1.20' && 'flink-1.20' || 'main' }}
          path: sql-runner

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run end-to-end via docker-compose
        working-directory: flink-sql-assert-runner
        env:
          SQL_RUNNER_REPO: ${{ github.workspace }}/sql-runner
        run: ./ci/run.sh ${{ matrix.profile }}

      - name: Upload result file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.profile }}
          path: flink-sql-assert-runner/result/result.txt
          if-no-files-found: warn

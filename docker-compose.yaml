services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.2.1
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka_broker:
    image: confluentinc/cp-server:7.5.1
    hostname: kafka_broker
    container_name: kafka_broker
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    healthcheck:
      test: [ "CMD", "cub", "kafka-ready", "-b", "kafka_broker:29092", "1", "40"]
      interval: 5s
      timeout: 90s
      retries: 2
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka_broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_METRIC_REPORTERS: io.confluent.metrics.reporter.ConfluentMetricsReporter
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CONFLUENT_METRICS_REPORTER_TOPIC_REPLICAS: 1
      CONFLUENT_METRICS_ENABLE: 'true'
      KAFKA_LOG4J_LOGGERS: org.apache.zookeeper=ERROR,org.apache.kafka=ERROR, kafka=ERROR, kafka.cluster=ERROR,kafka.controller=ERROR, kafka.coordinator=ERROR,kafka.log=ERROR,kafka.server=ERROR,kafka.zookeeper=ERROR,state.change.logger=ERROR
      KAFKA_LOG4J_ROOT_LOGLEVEL: ERROR
      CONFLUENT_METRICS_REPORTER_BOOTSTRAP_SERVERS: kafka_broker:29092

  apicurio:
    container_name: apicurio
    image: apicurio/apicurio-registry-mem:2.4.12.Final
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/" ]
      interval: 2s
      timeout: 90s
      retries: 2
    ports:
      - 8080:8080

  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: kafka-ui
    depends_on:
      - kafka_broker
    ports:
      - "9001:8080"
    restart: always
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka_broker:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://apicurio:8080/apis/ccompat/v7

  init-sources:
    image: confluentinc/cp-kafka:latest
    env_file:
      - ./integration.env
    depends_on:
      - kafka_broker
    container_name: init-sources
    volumes:
      - ./src/main/resources/data/avro/:/tmp/avrosink
    healthcheck:
      test: [ "CMD", "kafka-topics", "--list", "--bootstrap-server", "kafka_broker:29092" ]
      interval: 30s
      timeout: 10s
      retries: 4
    command:
      - bash
      - -c
      - |
        cub kafka-ready -b kafka_broker:29092 1 40 &&
         mkdir -p /tmp/avrosource/ &&
         curl -X GET $$SCHEMA_REGISTRY/api/artifacts/$$SOURCE_TOPIC-value \
           -H "Accept: application/json" \
           -o /tmp/avrosource/$$SOURCE_TOPIC-value.asvc &&
         curl -X POST http://apicurio:8080/api/artifacts \
           -H "Content-Type: application/json" \
           -H "X-Registry-ArtifactId: $$SOURCE_TOPIC-value " \
           -d @/tmp/avrosource/$$SOURCE_TOPIC-value.asvc &&
         curl -X POST http://apicurio:8080/api/artifacts \
           -H "Content-Type: application/json" \
           -H "X-Registry-ArtifactId: $$SINK_TOPIC-value " \
           -d @/tmp/avrosink/$$SINK_TOPIC.avsc &&
         kafka-topics --create --topic $$SOURCE_TOPIC --bootstrap-server kafka_broker:29092
         sleep infinity

  ## FLINK
  ## Drop your SQL-runner job JAR into ./flink-jars/ — it will be uploaded to
  ## the JobManager and submitted via Flink's REST API by flink-sql-assert-runner.
  jobmanager:
    container_name: jobmanager
    image: flink:2.0.1-scala_2.12-java17
    ports:
      - "8081:8081"
    volumes:
      - ./src/main/resources/data/sql-script/:/opt/flink/sql
      - ./flink-jars/:/opt/flink/usrlib
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        rest.port: 8081
        rest.bind-address: 0.0.0.0
        state.backend: rocksdb
        state.backend.incremental: true
        classloader.resolve-order: parent-first

  taskmanager:
    container_name: taskmanager
    image: flink:2.0.1-scala_2.12-java17
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        rest.port: 8081
        taskmanager.numberOfTaskSlots: 2
        state.backend: rocksdb
        state.backend.incremental: true

